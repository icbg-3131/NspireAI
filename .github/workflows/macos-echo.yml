name: macOS ARM64 echo bundle

on:
  workflow_dispatch:
  push:
    branches: [nspire-native-macos-packaging]
    tags: ['native-echo-v*']

permissions:
  contents: read

jobs:
  build:
    # Standard hosted runners are free for public repositories. Skip private
    # repositories so this workflow cannot consume private Actions minutes.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Test native packet exchange and the echo backend
        run: python -m unittest -v bridge.test_native_navnet bridge.test_protocol bridge.test_navnet_bridge
      - name: Install build-runner tools
        run: brew install autoconf automake libtool
      - name: Build and smoke-test the unpacked ARM64 bundle
        shell: bash
        run: |
          if ! PYTHON_BIN=python scripts/build-macos-echo.sh 2>&1 | tee "$RUNNER_TEMP/nspire-build.log"; then
            detail="$(tail -25 "$RUNNER_TEMP/nspire-build.log")"
            detail="${detail//%/%25}"
            detail="${detail//$'\n'/%0A}"
            detail="${detail//$'\r'/%0D}"
            printf '::error title=macOS packaging failed::%s\n' "$detail"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NspireAI-Echo-macos-arm64
          path: |
            dist/NspireAI-Echo-macos-arm64.zip
            dist/NspireAI-Echo-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/native-echo-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: NspireAI-Echo-macos-arm64
      - name: Publish the build and checksum on the tagged version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check NspireAI-Echo-macos-arm64.zip.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "NspireAI Echo $GITHUB_REF_NAME" \
            --notes "Standalone Apple Silicon echo bridge for the existing NspireAI NGC calculator executable. The macOS build self-test does not verify a physical connection. The bundle is ad-hoc signed and has not been notarized." \
            NspireAI-Echo-macos-arm64.zip NspireAI-Echo-macos-arm64.zip.sha256
