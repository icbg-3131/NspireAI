name: macOS ARM64 echo bundle

on:
  workflow_dispatch:
  push:
    branches: [nspire-native-macos-packaging]

permissions:
  contents: read

jobs:
  build:
    # The standard macOS ARM64 runner is free in public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Test native packet exchange and the echo backend
        run: python -m unittest -v bridge.test_native_navnet bridge.test_protocol bridge.test_navnet_bridge
      - name: Install build-runner tools
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          source scripts/macos-ci-log.sh
          run_logged tools brew install autoconf automake libtool
      - name: Build the ARM64 ZIP
        shell: bash
        run: |
          source scripts/macos-ci-log.sh
          run_logged build env PYTHON_BIN=python scripts/build-macos-echo.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: macos-build-diagnostics
          path: |
            ${{ runner.temp }}/nspire-tools.log
            ${{ runner.temp }}/nspire-build.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-unverified-build-transfer
          path: |
            dist/NspireAI-Echo-macos-arm64.zip
            dist/NspireAI-Echo-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: build
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: macos-arm64-unverified-build-transfer
          path: package
      - name: Verify the extracted package on a fresh runner
        shell: bash
        run: |
          source scripts/macos-ci-log.sh
          run_logged verify scripts/verify-macos-echo.sh package
          checksum="$(cat package/NspireAI-Echo-macos-arm64.zip.sha256)"
          printf '::notice title=Verified ZIP SHA-256::%s\n' "$checksum"
          printf '\n**Verified ZIP SHA-256**\n\n```text\n%s\n```\n' "$checksum" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: macos-verification-diagnostics
          path: ${{ runner.temp }}/nspire-verify.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NspireAI-Echo-macos-arm64
          path: |
            package/NspireAI-Echo-macos-arm64.zip
            package/NspireAI-Echo-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30
